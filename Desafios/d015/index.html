<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="tudo">
        <form action="cadastro.php" method="post">
            <label for="name">Nome:</label>
            <input type="text" id="name" name="name" required>

            <label for="sname">Sobrenome:</label>
            <input type="text" id="sname" name="sname" required>
            
            <label for="idade">idade:</label>
            <input type="range" id="idade" name="idade" required min="1" max="120"
            value="25"
            oninput="this.nextElementSibling.value = this.value">
            <output for="idade" id="idade-output">25</output>

            <label for="nacimento">Data de Nascimento:</label>
            <input type="date" id="nacimento" name="nacimento" required>

            <label for="sex">sexo:</label>

            <div id="sx">
                <label for="masc">Masculino</label>
                <input type="radio" id="masc" name="sexo" value="masculino">
                <label for="fem">Feminino</label>
                <input type="radio" id="fem" name="sexo" value="feminino">
            </div>

            <form action="cadastro.php" method="post" id="esporte">
                <label >Esportes:</label>
                <div id="esporte">
                    <ul>
                        <li><label for="1esporte">Futebol</label>
                            <input type="checkbox" id="1esporte" name="esporte" value="futebol"></li>
                        <li><label for="2esporte">Basquete</label>
                            <input type="checkbox" id="2esporte" name="esporte" value="basquete"></li>
                        <li><label for="3esporte">Vôlei</label>
                            <input type="checkbox" id="3esporte" name="esporte" value="volei"></li>
                        <li><label for="4esporte">Tênis</label>
                            <input type="checkbox" id="4esporte" name="esporte" value="tenis"></li>
                        <li><label for="5esporte">Natação</label>
                            <input type="checkbox" id="5esporte" name="esporte" value="natacao"></li>
                        <li><label for="6esporte">Handebol</label>
                            <input type="checkbox" id="6esporte" name="esporte" value="handebol"></li>
                        <li><label for="7esporte">Ciclismo</label>
                            <input type="checkbox" id="7esporte" name="esporte" value="ciclismo"></li>
                        <li><label for="8esporte">Atletismo</label>
                            <input type="checkbox" id="8esporte" name="esporte" value="atletismo"></li>
                        <li><label for="9esporte">Ginástica</label>
                            <input type="checkbox" id="9esporte" name="esporte" value="ginastica"></li>
                        <li><label for="10esporte">Skate</label>
                            <input type="checkbox" id="10esporte" name="esporte" value="skate"></li>
                        <li><label for="11esporte">Surf</label>
                            <input type="checkbox" id="11esporte" name="esporte" value="surf"></li>
                        <li><label for="12esporte">Hóquei</label>
                            <input type="checkbox" id="12esporte" name="esporte" value="hoquei"></li>
                        <li>
                            <label for="13esporte">Queimada</label>
                            <input type="checkbox" id="13esporte" name="esporte" value="queimada"></li>
                        <li><label for="14esporte">Futsal</label>
                            <input type="checkbox" id="14esporte" name="esporte" value="futsal"></li>
                        <li><label for="15esporte">Corrida</label>
                            <input type="checkbox" id="15esporte" name="esporte" value="corrida"></li>
                    </ul>
                </div>
                <label for="jogos">Jogos Eletrônicos:</label>
                <select id="jogos" name="jogos" required>
                    <option value="fortnite">Fortnite</option>
                    <option value="minecraft">Minecraft</option>
                    <option value="callofduty">Call of Duty</option>
                    <option value="leagueoflegends">League of Legends</option>
                    <option value="mario">Mario</option>
                    <option value="sonic">Sonic</option>
                    <option value="valorant">Valorant</option>
                    <option value="gta">GTA V</option>
                    <option value="fifa">FIFA 21</option>
                    <option value="jakanddaxter">Jak and Daxter</option>
                    <option value="godofwar">God of War</option>
                    <option value="zelda">The Legend of Zelda</option>
                
                </select>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </form>
            

        </form>
    </div>
</body>
</html>
